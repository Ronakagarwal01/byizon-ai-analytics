services:
  - type: web
    name: byizon-ai-analytics
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: byizon-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BYIZON_DATA_DIR
        value: /var/data
      - key: BYIZON_SESSION_SECRET
        generateValue: true
      - key: BYIZON_CONNECTOR_ENCRYPTION_KEY
        sync: false
      - key: BYIZON_ENV
        value: production
      - key: OAUTH_CALLBACK_BASE
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: STITCH_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_WORKSPACE_CLIENT_ID
        sync: false
      - key: GOOGLE_WORKSPACE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
